<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Chatbot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PRIVATE CHATBOT · V1</p>
          <h1>My Chatbot</h1>
        </div>
        <button id="new-chat" class="secondary" type="button">New chat</button>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <article class="message assistant">
          <p>Hello. What would you like to talk through?</p>
        </article>
      </section>

      <form id="chat-form" class="composer">
        <label class="sr-only" for="message-input">Your message</label>
        <textarea id="message-input" rows="1" maxlength="4000" placeholder="Write a message…" required></textarea>
        <button id="send-button" type="submit">Send</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
