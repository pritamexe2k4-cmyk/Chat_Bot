# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: CI only - Azure deployment paused - preetam-chatbot-2026

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY_PRODUCTION to deploy main to Azure
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !node_modules
            !.git
            !.env
          if-no-files-found: error

  deploy:
    # Production deployment is intentionally paused while the product direction is reviewed.
    # Keep this job for later reactivation; the Azure App Service is not deleted or stopped.
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1895A9D04FBB4BBF93B7C41026BA6DD2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6E29338E87704B1BBBC5777F70B058E7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_16250559039F45DB9DA2CAB84C38B4C3 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'preetam-chatbot-2026'
          slot-name: 'Production'
          package: .
