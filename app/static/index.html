<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azure Chatbot</title>
  <style>
    :root { color-scheme: dark; --ink: #edf4f2; --muted: #9eafad; --panel: #152322; --line: #29403c; --accent: #7de0bd; --user: #21483f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); font: 16px/1.5 Georgia, 'Times New Roman', serif; background: radial-gradient(circle at 10% 0%, #24443e, transparent 40%), #0b1515; }
    main { width: min(900px, 100%); min-height: 100vh; margin: auto; padding: 48px 24px 28px; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 4.5rem); line-height: .95; font-weight: 400; letter-spacing: -.04em; }
    .status { color: var(--accent); font: 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; text-transform: uppercase; letter-spacing: .12em; }
    #messages { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 10px 0 28px; }
    .message { max-width: 78%; padding: 15px 18px; border: 1px solid var(--line); border-radius: 4px 18px 18px 18px; white-space: pre-wrap; }
    .message.user { align-self: end; background: var(--user); border-radius: 18px 4px 18px 18px; }
    .message.assistant { background: var(--panel); }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    form { display: flex; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
    textarea { flex: 1; min-height: 54px; max-height: 160px; resize: vertical; padding: 15px; color: var(--ink); background: #101d1c; border: 1px solid var(--line); border-radius: 4px; font: inherit; }
    button { align-self: stretch; padding: 0 22px; color: #09201a; background: var(--accent); border: 0; border-radius: 4px; font: 700 14px ui-monospace, SFMono-Regular, Consolas, monospace; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    @media (max-width: 560px) { main { padding: 28px 16px 18px; } header { align-items: start; flex-direction: column; } .message { max-width: 92%; } form { align-items: stretch; flex-direction: column; } button { min-height: 48px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Azure<br>Chatbot</h1><div class="status" id="status">Ready</div></header>
    <section id="messages" aria-live="polite"><p class="empty">Ask something to begin.</p></section>
    <form id="chat-form"><textarea id="message" placeholder="Write a message..." aria-label="Message" required></textarea><button id="send" type="submit">SEND</button></form>
  </main>
  <script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const messages = document.querySelector('#messages');
    const status = document.querySelector('#status');
    const send = document.querySelector('#send');
    const history = [];

    function addMessage(role, content) {
      messages.querySelector('.empty')?.remove();
      const item = document.createElement('div');
      item.className = `message ${role}`;
      item.textContent = content;
      messages.appendChild(item);
      item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage('user', message);
      input.value = '';
      send.disabled = true;
      status.textContent = 'Thinking';
      try {
        const response = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message, history }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Request failed');
        addMessage('assistant', data.reply);
        history.push({ role: 'user', content: message });
        history.push({ role: 'assistant', content: data.reply });
        status.textContent = 'Ready';
      } catch (error) {
        addMessage('assistant', `Error: ${error.message}`);
        status.textContent = 'Connection error';
      } finally { send.disabled = false; input.focus(); }
    });
  </script>
</body>
</html>
